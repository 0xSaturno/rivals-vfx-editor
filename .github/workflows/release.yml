name: Release

on:
  push:
    tags:
      - 'v*'
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Root Dependencies
        run: npm install

      - name: Install Frontend Dependencies
        working-directory: ./RVFXE
        run: npm install

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build UAssetTool
        run: |
          dotnet publish UAssetToolRivals/src/UAssetTool/UAssetTool.csproj -c Release -r win-x64 --no-self-contained

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Application
        run: npx tauri build --no-bundle

      - name: Prepare Release Package
        shell: pwsh
        run: |
          Write-Host "Preparing release package folder..."
          New-Item -ItemType Directory -Force -Path release_pkg | Out-Null
          New-Item -ItemType Directory -Force -Path release_pkg/tools | Out-Null
          
          Write-Host "Copying files..."
          Copy-Item "target/release/rivals-vfx-editor.exe" -Destination "release_pkg/" -Force
          Copy-Item "README.md" -Destination "release_pkg/" -Force
          Copy-Item "LICENSE" -Destination "release_pkg/" -Force
          
          # Copy UAssetTool publish artifacts, excluding any .pdb files
          Copy-Item "UAssetToolRivals/src/UAssetTool/bin/Release/net8.0/win-x64/publish/*" -Destination "release_pkg/tools/" -Exclude "*.pdb" -Force -Recurse
          
          Write-Host "Creating zip archive..."
          Compress-Archive -Path release_pkg/* -DestinationPath "Rivals-VFX-Editor-Windows.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: Rivals-VFX-Editor-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

